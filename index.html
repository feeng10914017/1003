<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>世界脈動 · 即時掌握全球大小事</title>
  <meta name="description" content="世界脈動 World Pulse — 彙整 21 個中英文新聞來源，每小時更新，依分類與地區瀏覽全球新聞。">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <!-- 分享到 LINE／Facebook 時的預覽卡片（發布時 GitHub 會自動把圖片換成完整網址） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="世界脈動 World Pulse">
  <meta property="og:title" content="世界脈動 World Pulse — 即時掌握全球大小事">
  <meta property="og:description" content="彙整 21 個中英文新聞來源，依分類、地區瀏覽全球新聞，並追蹤熱門話題。每小時更新。">
  <meta property="og:image" content="images/og-cover.jpg">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700;900&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#fffdf8">
  <script>
    // 在畫面出現前先套用讀者選的配色，避免先閃一下預設顏色
    // 沒選過（或選「自動」）：裝置是深色模式就用深色，否則用暖白
    (function () {
      var choice;
      try { choice = JSON.parse(localStorage.getItem('world-pulse-theme')); } catch (e) {}
      if (!choice || choice === 'auto') {
        choice = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'paper';
      }
      document.documentElement.setAttribute('data-theme', choice);
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">
        <img src="images/logo.svg" alt="" width="40" height="40">
        <span>
          <strong data-i18n="siteName">世界脈動</strong>
          <small id="masthead-date"></small>
        </span>
      </a>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜尋新聞關鍵字…" autocomplete="off">
      </label>

      <div class="header-actions">
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="zh" aria-pressed="true">中</button>
          <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <div class="theme-picker">
          <button type="button" id="theme-btn" class="icon-btn" aria-label="配色" aria-haspopup="true" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3Z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15" cy="7.5" r="1.2"/></svg>
          </button>
          <div id="theme-menu" class="theme-menu" role="menu" hidden></div>
        </div>
        <button type="button" id="refresh-btn" class="icon-btn" aria-label="重新整理">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="ticker">
    <div class="container ticker__inner">
      <span class="ticker__label"><span class="pulse-dot" aria-hidden="true"></span><span data-i18n="liveLabel">即時</span></span>
      <div class="ticker__viewport">
        <div id="ticker-track" class="ticker__track"></div>
      </div>
    </div>
  </div>

  <main class="container">
    <section class="hot" aria-labelledby="hot-title">
      <div class="hot__head">
        <h2 id="hot-title" class="hot__title"><span class="pulse-dot" aria-hidden="true"></span><span data-i18n="hotTitle">熱門話題</span></h2>
        <div class="seg" role="tablist">
          <button type="button" class="seg__btn hot-tab" role="tab" data-tab="trends" aria-selected="true" data-i18n="hotTrends">搜尋趨勢</button>
          <button type="button" class="seg__btn hot-tab" role="tab" data-tab="focus" aria-selected="false" data-i18n="hotFocus">媒體焦點</button>
        </div>
        <div id="geo-switch" class="seg seg--plain"></div>
        <div class="seg seg--plain hot__sort" role="group">
          <button type="button" class="seg__btn sort-btn" data-sort="hot" aria-pressed="true" data-i18n="sortHot">最熱</button>
          <button type="button" class="seg__btn sort-btn" data-sort="new" aria-pressed="false" data-i18n="sortNew">最新</button>
        </div>
      </div>
      <div id="hot-strip" class="hot__strip"></div>
      <p id="hot-note" class="hot__note"></p>
    </section>

    <section class="filters">
      <div class="filter-row">
        <span class="filter-label" data-i18n="categoryLabel">分類</span>
        <div id="cat-chips" class="chips"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label" data-i18n="regionLabel">地區</span>
        <div id="region-chips" class="chips"></div>
      </div>
      <div class="filter-row">
        <span class="filter-label" data-i18n="langLabel">原文語言</span>
        <div id="lang-chips" class="chips"></div>
      </div>
    </section>

    <div class="status">
      <div class="status__left">
        <span id="status-text"></span>
        <button type="button" id="new-pill" class="new-pill" aria-pressed="false" hidden></button>
      </div>
      <div class="status__right">
        <span id="result-count"></span>
        <div class="seg seg--icons" role="group">
          <button type="button" class="seg__btn view-btn" data-view="cards" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
          </button>
          <button type="button" class="seg__btn view-btn" data-view="list" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="5" rx="1"/><rect x="3" y="15" width="5" height="5" rx="1"/><path d="M11 5.5h10M11 8h6M11 16.5h10M11 19h6"/></svg>
          </button>
        </div>
      </div>
    </div>
    <p id="status-warn" class="status-warn" hidden></p>

    <section id="news-grid" class="news-grid" aria-live="polite">
      <!-- 程式啟動前先顯示的載入提示；程式跑起來後會換成新聞 -->
      <div class="state-panel state-panel--loading" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p class="state-panel__text">正在載入最新新聞… Loading the latest headlines…</p>
      </div>
    </section>
    <noscript>
      <div class="state-panel state-panel--error">
        <h2 class="state-panel__title">需要開啟 JavaScript</h2>
        <p class="state-panel__text">這個網站需要 JavaScript 才能顯示新聞。請在瀏覽器設定中開啟 JavaScript，然後重新整理頁面。<br>This site needs JavaScript to show the news. Please enable it and reload the page.</p>
      </div>
    </noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer">新聞內容版權屬於各原始媒體，本站僅透過各媒體公開的新聞摘要（RSS）顯示標題與摘要；「搜尋趨勢」資料來自 Google。</p>
    </div>
  </footer>

  <dialog id="article" class="article">
    <button type="button" id="article-close" class="article__close" aria-label="關閉">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
    <div id="article-media" class="article__media"></div>
    <div class="article__body">
      <div id="article-tags" class="article__tags"></div>
      <h2 id="article-title" class="article__title"></h2>
      <div class="article__meta">
        <strong id="article-source"></strong>
        <span id="article-time"></span>
      </div>
      <p id="article-desc" class="article__desc"></p>
      <div id="article-related" class="article__related" hidden>
        <h3 data-i18n="relatedNews">相關報導</h3>
        <ul id="article-related-list"></ul>
      </div>
      <p id="article-note" class="article__note" data-i18n="modalNote">這裡只顯示摘要，完整報導請點「閱讀原文」。</p>
      <div id="trend-actions" class="article__actions" hidden>
        <button type="button" id="article-search" class="btn-primary" hidden></button>
        <a id="trend-google-news" class="btn-secondary" href="#" target="_blank" rel="noopener noreferrer">
          <span data-i18n="googleNews">Google 新聞搜尋</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
        <a id="trend-google-search" class="btn-secondary" href="#" target="_blank" rel="noopener noreferrer">
          <span data-i18n="googleSearch">Google 搜尋</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
      </div>
      <div id="article-actions" class="article__actions">
        <a id="article-link" class="btn-primary" href="#" target="_blank" rel="noopener noreferrer">
          <span data-i18n="readMore">閱讀原文</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
        </a>
        <a id="article-translate" class="btn-secondary" href="#" target="_blank" rel="noopener noreferrer" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h9M8.5 3v2M6 5c.6 3.2 2.6 5.8 5.5 7.2M11 5c-.8 3.6-3.1 6.4-7 8"/><path d="m13 21 4.5-10L22 21M14.5 17.5h6"/></svg>
          <span data-i18n="translate">用 Google 翻譯原文</span>
        </a>
        <button type="button" id="article-share" class="btn-secondary">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.4M8.2 13.2l7.6 4.4"/></svg>
          <span data-i18n="share">分享</span>
        </button>
      </div>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/feeds.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 啟動檢查：瀏覽器太舊或程式檔沒載入時，10 秒後改顯示說明，不讓頁面一直停在「載入中」
    setTimeout(function () {
      if (window.WORLD_PULSE_READY) return;
      var grid = document.getElementById('news-grid');
      if (!grid) return;
      grid.innerHTML =
        '<div class="state-panel state-panel--error" role="alert">' +
        '<h2 class="state-panel__title">網站沒有正常啟動</h2>' +
        '<p class="state-panel__text">請重新整理頁面。如果還是不行，請改用最新版的 Chrome、Safari、Edge 或 Firefox。<br>' +
        'The site didn’t start properly. Please reload, or try an up-to-date browser.</p>' +
        '<button type="button" class="btn-primary" onclick="location.reload()">重新整理 Reload</button>' +
        '</div>';
    }, 10000);
  </script>
</body>
</html>
